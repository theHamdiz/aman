[package]
name = "aman"
version = "0.1.0"
edition = "2021"
description = "The definitive, high-performance binary integrity & signing platform. Supports P-256, Ed25519, Multi-sig, and Anti-tamper."
authors = ["Ahmad Hamdi <contact@hamdiz.me>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/theHamdiz/aman"
publish = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core Logic
aman-core = { path = "../aman-core", default-features = false, features = ["std", "p256"] }

# Core serialization (re-exported or used in fs/ffi)
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Cryptography (Standard P-256)
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem"], optional = true }
sha2 = { version = "0.10", default-features = false }
rand = { version = "0.8", default-features = false, optional = true }

# OS / FFI
libc = { version = "0.2", optional = true }

# Cryptography (Fast/Modern Ed25519)
ed25519-dalek = { version = "2.1", default-features = false, features = ["pem"], optional = true }

# Hashing (Ultra-fast)
blake3 = { version = "1.5", default-features = false, features = ["traits-preview"], optional = true }

# Utilities
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock"], optional = true } 
memmap2 = { version = "0.9", optional = true }

# CLI & Dev UX
clap = { version = "4.5", features = ["derive", "env"], optional = true }
anyhow = { version = "1.0", optional = true }
thiserror = { version = "1.0", optional = true }
tracing = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"

[features]
default = ["std", "p256", "cli"]

# Core capability levels
std = ["aman-core/std", "serde/std", "serde_json/std", "hex/std", "p256?/std", "sha2/std", "rand?/std", "chrono?/std", "anyhow", "thiserror", "dep:memmap2"]

# Feature toggles
cli = ["clap", "std", "p256", "ed25519", "blake3"]
p256 = ["dep:p256", "dep:rand", "aman-core/p256"]
ed25519 = ["dep:ed25519-dalek", "dep:rand", "aman-core/ed25519"]
blake3 = ["dep:blake3", "aman-core/blake3"]
mmap = ["dep:memmap2"]
debug-checks = ["dep:libc"] 

[build-dependencies]
cbindgen = "0.26"
