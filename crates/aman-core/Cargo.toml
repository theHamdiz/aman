[package]
name = "aman-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core serialization
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Cryptography (Standard P-256)
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem"], optional = true }
sha2 = { version = "0.10", default-features = false }
rand = { version = "0.8", default-features = false, optional = true }

# Cryptography (Fast/Modern Ed25519)
ed25519-dalek = { version = "2.1", default-features = false, features = ["pem"], optional = true }

# Hashing (Ultra-fast)
blake3 = { version = "1.5", default-features = false, features = ["traits-preview"], optional = true }

[features]
default = ["p256", "std"]
std = ["serde/std", "serde_json/std", "hex/std", "p256?/std", "sha2/std", "rand?/std", "ed25519-dalek?/std"]
p256 = ["dep:p256", "dep:rand"]
ed25519 = ["dep:ed25519-dalek", "dep:rand"]
blake3 = ["dep:blake3"]
